<!DOCTYPE html>
<html>
  <body>
    <!-- Slide Show -->
    <section>
      <img class="mySlides" src="food.avif" style="height:490px;">
      <img class="mySlides" src="food2.webp" style="height:490px;">
      <img class="mySlides" src="food3.jpg" style="height:490px;">
      <img class="mySlides" src="food4.webp" style="height:490px;">
      <img class="mySlides" src="food5.webp" style="height:490px;">
      <img class="mySlides" src="food6.jpg" style="height:490px;">
      <img class="mySlides" src="food7.webp" style="height:490px;">
      <img class="mySlides" src="food8.jpg" style="height:490px;">
    </section>
    <script>
      // Automatic Slideshow - change image every 3 seconds
      var myIndex = 0;
      carousel();

      function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
          x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}
        x[myIndex-1].style.display = "block";
        setTimeout(carousel, 3000);
      }
    </script>
  </body>
</html>
