<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>restaurant</title>
    <style>
        body{
            margin: 0px;
            background-color: aquamarine;
            font-family:'Times New Roman', Times, serif ;
            text-align: center;
        
        }
        .topnav{
            overflow: hidden;
            background-color: black;
        }
        .topnav a{
            float: left;
            color: paleturquoise;
            text-align: center;
            padding: 12px 10px;
            font-size: 17px;
            text-decoration: none;
        }
        .topnav a:hover{
            color: blueviolet;
            font-size: 20px;
        }
        .topnav a.active {
            background-color: darkblue;
            color: aqua;
        }
        .carousel-container{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
        .myslides{
            display: none;
            max-width: 100%;
            max-height: 100%;
        }
        .footer{
            position: fixed;
            left: 0px;
            bottom: 0px;
            background-color: black;
            color: white;
            text-align: center;
            width: 100%;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="Index.html" class="active">Home</a>
        <a href="AboutUs.html">AboutUs</a>
        <a href="Men.html">Menu</a>
        <a href="Contant.html">Contact</a>
    </div>
    <h1>Welcome to our restaurant</h1>
    <div class="carousel-container">
        <img class="myslides" src="restaurant.jpg" width="230px" border=3 height="300px" alt="restaurant">
        <img class="myslides" src="restaurant1.jpg" width="230px" border=3 height="300px" alt="restaurantr">
        <img class="myslides" src="restaurant2.jpg" width="230px" border=3 height="300px" alt="restaurant">
        <img class="myslides" src="restaurant3.jpg" width="230px" border=3 height="300px" alt="restaurant">
    </div>
    <div class="footer">
        @ All copyrights belong to Abirami <br>
        Contact : 📞 +91 562336562
    </div>
    <script>
        var Index = 0;
        function carousel(){
            var i;
            var x = document.getElementsByClassName("myslides")
            for (i = 0; i<x.length;i++){
                x[i].style.display = "none"
            }
            Index++
            if (Index > x.length){
                Index = 1
            }
            x[Index-1].style.display = "block"
            setTimeout(carousel,2000)
        }
        carousel()
    </script>
</body>
</html>
